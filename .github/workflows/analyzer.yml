name: Ultimate Analyzer v3

on:
  workflow_dispatch:
    inputs:
      auto_fix:
        description: "Auto-fix issues?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      commit_fixes:
        description: "Commit & push fixes?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
  push:
    branches: [main]
    paths:
      - "android/**"
      - "scripts/ultimate_analyzer.py"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Ultimate Analyzer v3
        env:
          WORKDIR: ${{ github.workspace }}
          OUTPUT_DIR: output
          AUTO_FIX: ${{ github.event.inputs.auto_fix || 'true' }}
        run: python scripts/ultimate_analyzer.py

      - name: Job summary
        if: always()
        run: |
          echo "## Ultimate Analyzer v3" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f output/issues.txt ]; then
            echo "### Issues" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            head -100 output/issues.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f output/fixes_applied.txt ]; then
            echo "### Fixes Applied" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat output/fixes_applied.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f output/build_predictions.txt ]; then
            echo "### Predictions" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat output/build_predictions.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit fixes
        if: |
          always() &&
          (github.event.inputs.commit_fixes == 'true' || github.event_name == 'push')
        run: |
          git config user.name "yad-analyzer[bot]"
          git config user.email "yad-analyzer@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Auto-fix by Ultimate Analyzer v3

            Fixes: $(cat output/fixes_applied.txt 2>/dev/null | wc -l)
            Created by KARYADI, Coding by KARYADI"
            git push || echo "Push failed"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyzer-v3-report-${{ github.run_number }}
          path: output/

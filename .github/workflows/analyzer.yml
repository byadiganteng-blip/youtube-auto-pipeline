name: Ultimate Analyzer

on:
  workflow_dispatch:
    inputs:
      auto_fix:
        description: "Auto-fix issues?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      commit_fixes:
        description: "Commit & push fixes?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
  push:
    branches: [main]
    paths:
      - "android/**"
      - "scripts/ultimate_analyzer.py"
      - ".github/workflows/analyzer.yml"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Ultimate Analyzer v2
        env:
          WORKDIR: ${{ github.workspace }}
          OUTPUT_DIR: output
          AUTO_FIX: ${{ github.event.inputs.auto_fix || 'true' }}
        run: python scripts/ultimate_analyzer.py

      - name: Show report
        if: always()
        run: |
          echo "## 📊 Ultimate Analyzer v2 Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f output/issues.txt ]; then
            echo "### Issues:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            head -50 output/issues.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f output/fixes_applied.txt ]; then
            echo "### Fixes:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat output/fixes_applied.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit fixes
        if: |
          always() &&
          (github.event.inputs.commit_fixes == 'true' || github.event_name == 'push')
        run: |
          git config user.name "yad-analyzer[bot]"
          git config user.email "yad-analyzer@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "🤖 Auto-fix by Ultimate Analyzer v2

            - Fixes: $(cat output/fixes_applied.txt 2>/dev/null | wc -l)
            - Report in artifact
            Created by KARYADI, Coding by KARYADI"
            git push || echo "⚠️  Push failed"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-report-${{ github.run_number }}
          path: output/

      - name: Create ZIP
        if: always()
        run: |
          cd output && zip -r ../analyzer-result.zip ./* && cd ..

      - name: Upload ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-result-zip
          path: analyzer-result.zip

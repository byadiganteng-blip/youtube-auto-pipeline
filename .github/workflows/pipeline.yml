name: Complete Pipeline + Per-Part Upload

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "URL Video"
        required: true
        type: string
      privacy:
        description: "Privacy"
        required: false
        default: "public"
        type: choice
        options:
          - public
          - unlisted
          - private
      method:
        description: "Metode remove watermark"
        required: false
        default: "blur"
        type: choice
        options:
          - blur
          - inpaint
      part_duration:
        description: "Durasi per part (detik)"
        required: false
        default: "300"
      auto_upload:
        description: "Auto upload ke YouTube?"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsm6 libxext6 libgl1 wget
        pip install opencv-python-headless numpy yt-dlp
        pip install google-auth google-auth-oauthlib google-api-python-client
    - name: Download video
      run: |
        python universal_downloader.py --url "${{ github.event.inputs.video_url }}" --output "input/video.mp4"
    - name: Remove watermark + Split per part
      run: |
        mkdir -p output
        python watermark_remover.py \
          --input input/video.mp4 \
          --output-dir output \
          --method "${{ github.event.inputs.method }}" \
          --part-duration "${{ github.event.inputs.part_duration }}" \
          --samples 30
        ls -la output/
    - name: Generate title & hashtag per part
      run: |
        for video in output/*.mp4; do
          echo "=========================================="
          echo "Processing: $video"
          echo "=========================================="
          python auto_hashtag.py "$video"
          echo ""
        done
    - name: Upload per part to YouTube
      if: github.event.inputs.auto_upload == 'true'
      env:
        YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
      run: |
        echo "$YOUTUBE_TOKEN" > token.pickle
        python upload_per_part.py \
          --input-dir output \
          --privacy "${{ github.event.inputs.privacy }}" \
          --delay 60
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pipeline-result
        path: output/*.mp4
        retention-days: 30
        overwrite: true
    - name: Create Release per Part
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        files: output/*.mp4
        tag_name: parts-v${{ github.run_number }}
        name: Parts v${{ github.run_number }}
        body: |
          Video split & watermark removed
          Part duration: ${{ github.event.inputs.part_duration }}s
          Source: ${{ github.event.inputs.video_url }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

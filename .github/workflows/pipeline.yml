name: Complete Pipeline + Per-Part Upload

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "URL Video"
        required: true
        type: string
      process_mode:
        description: "Mode: Hapus Watermark atau Langsung Upload?"
        required: true
        default: "remove_watermark"
        type: choice
        options:
          - remove_watermark
          - skip_watermark
      video_size:
        description: "Ukuran Video (preset untuk platform)"
        required: true
        default: "original"
        type: choice
        options:
          - original
          - yt_shorts
          - tiktok
          - ig_reels
          - fb_reels
          - whatsapp_status
          - ig_feed_square
          - ig_feed_portrait
          - yt_landscape
          - yt_4k
          - fb_video
          - twitter
      method:
        description: "Metode Remove Watermark"
        required: false
        default: "blur"
        type: choice
        options:
          - blur
          - inpaint
      part_duration:
        description: "Durasi per Part (detik)"
        required: true
        default: "300"
        type: string
      samples:
        description: "Sample frame"
        required: false
        default: "30"
        type: string
      privacy:
        description: "Privacy"
        required: true
        default: "public"
        type: choice
        options:
          - public
          - unlisted
          - private
      auto_upload:
        description: "Auto Upload?"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      upload_type:
        description: "Tipe Upload"
        required: true
        default: "video"
        type: choice
        options:
          - video
          - reels
      upload_delay:
        description: "Delay upload (detik)"
        required: false
        default: "60"
        type: string
      start_part:
        description: "Mulai part"
        required: false
        default: "1"
        type: string

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsm6 libxext6 libgl1 wget curl
          pip install --upgrade pip
          pip install opencv-python-headless numpy yt-dlp requests
          pip install google-auth google-auth-oauthlib google-api-python-client
          pip install PyNaCl

      - name: Download Video
        run: |
          mkdir -p input output
          python universal_downloader.py \
            --url "${{ github.event.inputs.video_url }}" \
            --output "input/video.mp4"
          ls -lah input/

      - name: Process Video
        run: |
          echo "=========================================="
          echo "  Video Size Preset: ${{ github.event.inputs.video_size }}"
          echo "=========================================="
          python watermark_remover.py \
            --input "input/video.mp4" \
            --output-dir "output" \
            --method "${{ github.event.inputs.method }}" \
            --part-duration "${{ github.event.inputs.part_duration }}" \
            --samples "${{ github.event.inputs.samples }}" \
            --process-mode "${{ github.event.inputs.process_mode }}" \
            --video-size "${{ github.event.inputs.video_size }}"
          ls -lah output/

      - name: Generate Metadata
        run: |
          for video in output/*.mp4; do
            if [ -f "$video" ]; then
              python auto_hashtag.py "$video" "${{ github.event.inputs.upload_type }}" || true
            fi
          done

      - name: Check Token
        id: check_token
        if: github.event.inputs.auto_upload == 'true'
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          if [ -z "$YOUTUBE_TOKEN" ]; then
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::warning::YOUTUBE_TOKEN tidak ada! Skip upload."
          else
            echo "available=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload to YouTube
        if: github.event.inputs.auto_upload == 'true' && steps.check_token.outputs.available == 'true'
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          echo "$YOUTUBE_TOKEN" | base64 -d > token.pickle
          python upload_per_part.py \
            --input-dir "output" \
            --privacy "${{ github.event.inputs.privacy }}" \
            --delay "${{ github.event.inputs.upload_delay }}" \
            --start-part "${{ github.event.inputs.start_part }}" \
            --upload-type "${{ github.event.inputs.upload_type }}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-result-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 30
          overwrite: true

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.mp4
          tag_name: parts-v${{ github.run_number }}
          name: "Parts v${{ github.run_number }}"
          body: |
            Source: ${{ github.event.inputs.video_url }}
            Mode: ${{ github.event.inputs.process_mode }}
            Video Size: ${{ github.event.inputs.video_size }}
            Upload Type: ${{ github.event.inputs.upload_type }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

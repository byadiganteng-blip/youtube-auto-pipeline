name: Complete Pipeline + Per-Part Upload

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "URL Video"
        required: true
        type: string
      process_mode:
        description: "Mode Watermark"
        required: true
        default: "remove_watermark"
        type: choice
        options: [remove_watermark, skip_watermark]
      method:
        description: "Metode Watermark"
        required: true
        default: "blur"
        type: choice
        options: [blur, inpaint]
      video_size:
        description: "Ukuran Video"
        required: true
        default: "original"
        type: choice
        options:
          - original
          - yt_shorts
          - tiktok
          - ig_reels
          - fb_reels
          - whatsapp_status
          - ig_feed_square
          - ig_feed_portrait
          - yt_landscape
          - yt_4k
          - fb_video
          - twitter
      video_quality:
        description: "Kualitas Video"
        required: true
        default: "original"
        type: choice
        options: [original, 144p, 240p, 360p, 480p, 720p, 1080p, 1440p, 2160p]
      part_duration:
        description: "Durasi per Part (detik)"
        required: true
        default: "60"
        type: string
      upload_type:
        description: "Tipe Upload"
        required: true
        default: "video"
        type: choice
        options: [video, reels]
      privacy:
        description: "Privacy"
        required: false
        default: "public"
        type: choice
        options: [public, unlisted, private]
      auto_upload:
        description: "Auto Upload YouTube?"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      start_part:
        description: "Mulai dari part (untuk resume)"
        required: false
        default: "1"
        type: string

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsm6 libxext6 libgl1 wget curl
          pip install --upgrade pip
          pip install opencv-python-headless numpy yt-dlp requests
          pip install google-auth google-auth-oauthlib google-api-python-client
          pip install PyNaCl

      - name: Download Video
        run: |
          mkdir -p input output raw_output
          python universal_downloader.py \
            --url "${{ github.event.inputs.video_url }}" \
            --output "input/video.mp4"
          ls -lah input/
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 input/video.mp4 || true

      - name: Check watermark_remover.py args
        id: check_wm
        run: |
          if grep -q -- "--start-part" watermark_remover.py; then
            echo "has_start_part=true" >> $GITHUB_OUTPUT
          else
            echo "has_start_part=false" >> $GITHUB_OUTPUT
          fi

      - name: Process Video (Watermark + Split per Part)
        run: |
          if [ "${{ steps.check_wm.outputs.has_start_part }}" == "true" ]; then
            echo ">>> With --start-part"
            python watermark_remover.py \
              --input "input/video.mp4" \
              --output-dir "raw_output" \
              --method "${{ github.event.inputs.method }}" \
              --part-duration "${{ github.event.inputs.part_duration }}" \
              --samples "30" \
              --process-mode "${{ github.event.inputs.process_mode }}" \
              --video-size "${{ github.event.inputs.video_size }}" \
              --video-quality "${{ github.event.inputs.video_quality }}" \
              --start-part "${{ github.event.inputs.start_part }}"
          else
            echo ">>> Without --start-part (fallback)"
            python watermark_remover.py \
              --input "input/video.mp4" \
              --output-dir "raw_output" \
              --method "${{ github.event.inputs.method }}" \
              --part-duration "${{ github.event.inputs.part_duration }}" \
              --samples "30" \
              --process-mode "${{ github.event.inputs.process_mode }}" \
              --video-size "${{ github.event.inputs.video_size }}" \
              --video-quality "${{ github.event.inputs.video_quality }}"
          fi
          ls -lah raw_output/

      - name: FIX VIDEO CODEC (H.264 yuv420p)
        run: |
          for video in raw_output/*.mp4; do
            if [ -f "$video" ]; then
              name=$(basename "$video")
              echo ">>> Processing $name"
              ffmpeg -y -i "$video" \
                -c:v libx264 -preset fast -crf 23 \
                -pix_fmt yuv420p \
                -c:a aac -b:a 128k -ar 44100 -ac 2 \
                -movflags +faststart \
                -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" \
                "output/$name"
            fi
          done
          ls -lah output/

      - name: Upload PART 1 (fast artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-01
          path: output/video_part001*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload PART 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-02
          path: output/video_part002*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload PART 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-03
          path: output/video_part003*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload PART 4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-04
          path: output/video_part004*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload PART 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-05
          path: output/video_part005*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload PART 6-10 (bundled)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parts-bundle
          path: |
            output/video_part006*.mp4
            output/video_part007*.mp4
            output/video_part008*.mp4
            output/video_part009*.mp4
            output/video_part01*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Create Release (untuk direct download link)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.mp4
          tag_name: pipeline-${{ github.run_number }}
          name: "Pipeline #${{ github.run_number }}"
          body: |
            Hasil proses video dari run #${{ github.run_number }}
            - Part duration: ${{ github.event.inputs.part_duration }}s
            - Quality: ${{ github.event.inputs.video_quality }}
            - Size: ${{ github.event.inputs.video_size }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload YouTube (optional)
        if: github.event.inputs.auto_upload == 'true'
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          PRIVACY: ${{ github.event.inputs.privacy }}
          UPLOAD_TYPE: ${{ github.event.inputs.upload_type }}
          START_PART: ${{ github.event.inputs.start_part }}
        run: |
          if [ -z "$YOUTUBE_TOKEN" ]; then
            echo "⚠️  YOUTUBE_TOKEN tidak ada, skip auto upload"
            exit 0
          fi
          echo "$YOUTUBE_TOKEN" | base64 -d > token.pickle
          python upload_per_part.py \
            --input-dir "output" \
            --privacy "$PRIVACY" \
            --delay "30" \
            --start-part "$START_PART" \
            --upload-type "$UPLOAD_TYPE" || echo "Upload failed, continuing"

name: Complete Pipeline + Per-Part Upload

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "URL Video"
        required: true
        type: string
      process_mode:
        description: "Mode Watermark"
        required: true
        default: "remove_watermark"
        type: choice
        options:
          - remove_watermark
          - skip_watermark
      method:
        description: "Metode Watermark"
        required: true
        default: "blur"
        type: choice
        options:
          - blur
          - inpaint
      video_size:
        description: "Ukuran Video"
        required: true
        default: "original"
        type: choice
        options:
          - original
          - yt_shorts
          - tiktok
          - ig_reels
          - fb_reels
          - whatsapp_status
          - ig_feed_square
          - ig_feed_portrait
          - yt_landscape
          - yt_4k
          - fb_video
          - twitter
      video_quality:
        description: "Kualitas Video"
        required: true
        default: "original"
        type: choice
        options:
          - original
          - 144p
          - 240p
          - 360p
          - 480p
          - 720p
          - 1080p
          - 1440p
          - 2160p
      part_duration:
        description: "Durasi per Part (detik)"
        required: true
        default: "60"
        type: string
      upload_type:
        description: "Tipe Upload"
        required: true
        default: "video"
        type: choice
        options:
          - video
          - reels

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsm6 libxext6 libgl1 wget curl
          pip install --upgrade pip
          pip install opencv-python-headless numpy yt-dlp requests
          pip install google-auth google-auth-oauthlib google-api-python-client
          pip install PyNaCl

      - name: Download Video
        run: |
          mkdir -p input output raw_output
          python universal_downloader.py \
            --url "${{ github.event.inputs.video_url }}" \
            --output "input/video.mp4"
          ls -lah input/
          echo "=== VIDEO INFO ==="
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 input/video.mp4 || true

      - name: Process Video (Watermark Removal)
        run: |
          python watermark_remover.py \
            --input "input/video.mp4" \
            --output-dir "raw_output" \
            --method "${{ github.event.inputs.method }}" \
            --part-duration "${{ github.event.inputs.part_duration }}" \
            --samples "30" \
            --process-mode "${{ github.event.inputs.process_mode }}" \
            --video-size "${{ github.event.inputs.video_size }}" \
            --video-quality "${{ github.event.inputs.video_quality }}"
          ls -lah raw_output/

      - name: FIX VIDEO CODEC (Re-encode to H.264 yuv420p)
        run: |
          echo "=== Re-encoding all videos to H.264 yuv420p (Android compatible) ==="
          for video in raw_output/*.mp4; do
            if [ -f "$video" ]; then
              name=$(basename "$video")
              echo ">>> Processing $name"
              # Cek codec asli
              ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt -of default=noprint_wrappers=1 "$video" || true
              # Re-encode ke H.264 + yuv420p + faststart
              ffmpeg -y -i "$video" \
                -c:v libx264 -preset fast -crf 23 \
                -pix_fmt yuv420p \
                -c:a aac -b:a 128k -ar 44100 -ac 2 \
                -movflags +faststart \
                -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" \
                "output/$name"
              echo "✅ $name done"
            fi
          done
          ls -lah output/
          echo "=== VERIFY OUTPUT ==="
          for video in output/*.mp4; do
            echo ">>> $video"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt,width,height -of default=noprint_wrappers=1 "$video" || true
          done

      - name: Generate Metadata
        run: |
          for video in output/*.mp4; do
            if [ -f "$video" ]; then
              python auto_hashtag.py "$video" "${{ github.event.inputs.upload_type }}" || true
            fi
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cliper-on-result-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 30

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.mp4
          tag_name: parts-v${{ github.run_number }}
          name: "Parts v${{ github.run_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

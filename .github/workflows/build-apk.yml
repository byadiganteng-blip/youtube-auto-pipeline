name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          cmdline-tools-version: 'latest'
          accept-android-sdk-licenses: true

      - name: Ensure gradlew
        working-directory: android
        run: |
          set -e
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.2
          fi
          chmod +x gradlew
          ls -la gradlew gradle/wrapper/

      - name: Decode Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CLIPER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "keystore_available=false" >> $GITHUB_OUTPUT
            echo "⚠️  Keystore tidak tersedia"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/cliper_on.jks
            echo "keystore_available=true" >> $GITHUB_OUTPUT
            echo "keystore_path=$RUNNER_TEMP/cliper_on.jks" >> $GITHUB_OUTPUT
            echo "✅ Keystore decoded ($(wc -c < $RUNNER_TEMP/cliper_on.jks) bytes)"
          fi

      - name: Build Release APK (signed)
        if: steps.keystore.outputs.keystore_available == 'true'
        working-directory: android
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_INJECT }}
          GH_USER: ${{ secrets.GH_USER_INJECT }}
          KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.CLIPER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CLIPER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CLIPER_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PGH_TOKEN="$GH_TOKEN" \
            -PGH_USER="$GH_USER"

      - name: Build Debug APK (fallback)
        if: steps.keystore.outputs.keystore_available != 'true'
        working-directory: android
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_INJECT }}
          GH_USER: ${{ secrets.GH_USER_INJECT }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -PGH_TOKEN="$GH_TOKEN" \
            -PGH_USER="$GH_USER"

      - name: Rename + Copy APK
        run: |
          mkdir -p artifacts
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk artifacts/CliperOn-release.apk
            echo "APK_NAME=CliperOn-release.apk" >> $GITHUB_ENV
            echo "APK_TYPE=release" >> $GITHUB_ENV
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/CliperOn-debug.apk
            echo "APK_NAME=CliperOn-debug.apk" >> $GITHUB_ENV
            echo "APK_TYPE=debug" >> $GITHUB_ENV
          fi
          ls -lah artifacts/

      - name: Get Version Info
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle | head -1)
          CODE=$(grep -oP 'versionCode\s+\K\d+' android/app/build.gradle | head -1)
          echo "name=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CliperOn-APK
          path: artifacts/*.apk
          retention-days: 30

      - name: Create Release (auto-update source)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          files: artifacts/*.apk
          tag_name: v${{ steps.version.outputs.name }}-${{ github.run_number }}
          name: "Cliper On v${{ steps.version.outputs.name }} (#${{ github.run_number }})"
          body: |
            ## Cliper On v${{ steps.version.outputs.name }}

            - **Version Code:** ${{ steps.version.outputs.code }}
            - **Build:** #${{ github.run_number }}
            - **Type:** ${{ env.APK_TYPE }}

            ### Update tanpa uninstall ✅
            1. Buka app → **Instruksi** → **Cek Update**
            2. Atau download APK di bawah
            3. Install — data aman
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          CODE="${{ steps.version.outputs.code }}"
          TAG="v${VERSION}-${{ github.run_number }}"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${{ env.APK_NAME }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"

          cat > version.json <<EOF
          {
            "versionName": "${VERSION}",
            "versionCode": ${CODE},
            "buildNumber": ${{ github.run_number }},
            "apkUrl": "${APK_URL}",
            "releaseUrl": "${RELEASE_URL}",
            "releaseNotes": "Update Cliper On v${VERSION} - build ${{ github.run_number }}",
            "forceUpdate": false,
            "minSdk": 24,
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          git config user.name "ysdev-bot"
          git config user.email "ysdev@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: version.json v${VERSION}"
            git push || echo "Push failed"
          fi

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.universal.videoeditor'
    compileSdk 34

    defaultConfig {
        applicationId "com.universal.videoeditor"
        minSdk 23
        targetSdk 34
        versionCode 30
        versionName "6.4"

        def ghToken = project.findProperty("GH_TOKEN") ?: System.getenv("GH_TOKEN") ?: ""
        def ghUser  = project.findProperty("GH_USER")  ?: System.getenv("GH_USER")  ?: ""
        buildConfigField "String", "GH_TOKEN", "\"${ghToken}\""
        buildConfigField "String", "GH_USER",  "\"${ghUser}\""
        buildConfigField "String", "STARTIO_APP_ID", "\"208202061\""

        vectorDrawables { useSupportLibrary true }
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH")
            def ksPass = System.getenv("KEYSTORE_PASSWORD")
            def kAlias = System.getenv("KEY_ALIAS")
            def kPass  = System.getenv("KEY_PASSWORD")
            if (ksPath && ksPass && kAlias && kPass) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias kAlias
                keyPassword kPass
            }
        }
    }

    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("KEYSTORE_PATH")) { signingConfig signingConfigs.release }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }
}

repositories {
    maven { url 'https://android-sdk.is.com/' }
    maven { url 'https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea' }
    maven { url 'https://maven.ironsrc.com/releases' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // Start.io / IronSource SDK
    implementation 'com.ironsource.sdk:mediationsdk:8.4.0'
    implementation 'com.ironsource.adapters:unityadsadapter:4.12.0'
    implementation 'com.ironsource.adapters:admobadapter:4.3.44'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
}
